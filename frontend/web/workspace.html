<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Chart Workspace</title>
    <script>
        // The Tauri shell owns the theme switch; the iframe shares its origin and
        // therefore its localStorage. Apply before first paint to avoid a flash.
        (function () {
            try {
                if (localStorage.getItem('tp-theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (err) { /* storage may be unavailable */ }
        })();
    </script>
    <style>
        /* Fonts are shared with the Tauri shell (frontend/web/fonts is Vite's publicDir). */
        @font-face { font-family: 'Clash Grotesk'; src: url("fonts/ClashGrotesk-Variable.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
        @font-face { font-family: 'Satoshi'; src: url("fonts/Satoshi-Variable.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
        @font-face { font-family: 'MesloLGS NFM'; src: url("fonts/MesloLGSNerdFontMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }

        /* Neutral chart palette — OpenTrader/TradingView chrome.
           Keep in sync with frontend/src/styles/tokens.css where the shell
           shares a value; the chart workspace deliberately uses the neutral
           grey/blue set instead of the shell's amber identity. */
        :root {
            --bg: #0f0f0f;
            --surface: #1f1f1f;
            --surface-2: #262626;
            --surface-3: #2e2e2e;
            --elevated: #2e2e2e;
            --panel: #1f1f1f;
            --field-bg: #1a1a1a;
            --text: #f2f2f2;
            --text-2: #c7c7c7;
            --text-3: #a3a3a3;
            --muted: #8c8c8c;
            --focus: #5b9cf6;
            --accent: #2962ff;
            --accent-text: #82b1ff;
            --accent-strong: #1e53e5;
            --accent-rgb: 41, 98, 255;
            --accent-soft: rgba(41, 98, 255, 0.18);
            --accent-line: rgba(41, 98, 255, 0.55);
            --accent-ink: #ffffff;
            --coral: #f5a623;
            --danger: #f7525f;
            --danger-rgb: 242, 54, 69;
            --danger-soft: rgba(242, 54, 69, 0.16);
            --success: #22ab94;
            --success-rgb: 8, 153, 129;
            --success-soft: rgba(8, 153, 129, 0.16);
            --border: #2e2e2e;
            --border-strong: #404040;
            --control-border: #6b6b6b;
            --hairline: rgba(255, 255, 255, 0.06);
            --grid-line: rgba(255, 255, 255, 0.03);
            --row-hover: #2e2e2e;
            --hover-wash: rgba(255, 255, 255, 0.06);
            --glass-bg: rgba(31, 31, 31, 0.78);
            --glass-bg-strong: rgba(31, 31, 31, 0.96);
            --glass-border: rgba(255, 255, 255, 0.10);
            --glass-shadow: 0 24px 64px rgba(0, 0, 0, 0.62);
            /* Chart canvas (read by workspace.js through getComputedStyle). */
            --chart-bg: #0f0f0f;
            --chart-text: #b8b8b8;
            --chart-grid: rgba(255, 255, 255, 0.055);
            --chart-crosshair: #758696;
            --chart-border: #2e2e2e;
            --chart-up: #089981;
            --chart-down: #f23645;
            --chart-up-rgb: 8, 153, 129;
            --chart-down-rgb: 242, 54, 69;
            --chart-up-text: #22ab94;
            --chart-down-text: #f7525f;
            --chart-ink: #f2f2f2;
            --chart-muted: #9b9b9b;
            /* One text family (bundled Satoshi) + mono for numeric readouts. */
            --font-body: 'Satoshi', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'MesloLGS NFM', ui-monospace, 'SFMono-Regular', Consolas, monospace;
            /* Type scale — 12px is the floor for interface text. */
            --text-xs: 12px;
            --text-sm: 13px;
            --text-base: 14px;
            --text-md: 16px;
            --text-lg: 19px;
            --text-xl: 24px;
            --leading-heading: 1.3;
            --leading-body: 1.5;
            --leading-dense: 1.4;
            --weight-medium: 500;
            --weight-semibold: 600;
            --weight-bold: 700;
            --icon-sm: 16px;
            --icon-md: 18px;
            --icon-lg: 20px;
            --icon-xl: 22px;
            --control-h-sm: 28px;
            --control-h: 32px;
            --input-h: 32px;
            --hit-min: 32px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --topbar-h: 46px;
            --subbar-h: 34px;
            --panel-head-h: 34px;
            --panel-foot-h: 24px;
            --grid-gap: 1px;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 6px;
            --radius-xl: 10px;
            --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.55);
            --shadow-panel: 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #ffffff;
            --surface: #f8f9fa;
            --surface-2: #f2f3f5;
            --surface-3: #e9ebef;
            --elevated: #ffffff;
            --panel: #ffffff;
            --field-bg: #f2f3f5;
            --text: #131722;
            --text-2: #424242;
            --text-3: #5d606b;
            --muted: #5f6673;
            --focus: #1848cc;
            --accent: #2962ff;
            --accent-text: #1848cc;
            --accent-strong: #1e53e5;
            --accent-rgb: 41, 98, 255;
            --accent-soft: #e3effd;
            --accent-line: rgba(41, 98, 255, 0.38);
            --accent-ink: #ffffff;
            --coral: #b26a00;
            --danger: #cc2f3c;
            --danger-rgb: 204, 47, 60;
            --danger-soft: rgba(204, 47, 60, 0.08);
            --success: #06806b;
            --success-rgb: 8, 153, 129;
            --success-soft: rgba(8, 153, 129, 0.08);
            --border: #e0e3eb;
            --border-strong: #d1d4dc;
            --control-border: #8a8d96;
            --hairline: rgba(19, 23, 34, 0.07);
            --grid-line: rgba(19, 23, 34, 0.03);
            --row-hover: #f2f3f5;
            --hover-wash: rgba(19, 23, 34, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.80);
            --glass-bg-strong: rgba(255, 255, 255, 0.96);
            --glass-border: rgba(19, 23, 34, 0.10);
            --glass-shadow: 0 24px 64px rgba(19, 23, 34, 0.14);
            --chart-bg: #ffffff;
            --chart-text: #4a4a4a;
            --chart-grid: #e6e9ef;
            --chart-crosshair: #9598a1;
            --chart-border: #e0e3eb;
            --chart-up: #089981;
            --chart-down: #f23645;
            --chart-up-rgb: 8, 153, 129;
            --chart-down-rgb: 242, 54, 69;
            --chart-up-text: #06806b;
            --chart-down-text: #cc2f3c;
            --chart-ink: #131722;
            --chart-muted: #6b7280;
            --shadow-pop: 0 8px 28px rgba(19, 23, 34, 0.16);
            --shadow-panel: 0 1px 2px rgba(19, 23, 34, 0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: var(--font-body);
            font-size: var(--text-base);
            line-height: var(--leading-body);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button, input, select, textarea { font: inherit; color: inherit; }
        ::selection { background: rgba(var(--accent-rgb), 0.26); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

        /* ── Shell ─────────────────────────────────────────────────────── */
        #ws-root {
            display: grid;
            grid-template-rows: var(--topbar-h) var(--subbar-h) 1fr;
            width: 100%; height: 100%;
            background: var(--bg);
        }

        #ws-topbar {
            display: flex; align-items: center; gap: 8px;
            padding: 0 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            min-width: 0; position: relative; z-index: 20;
        }

        .brand { display: flex; align-items: center; gap: 7px; padding-right: 8px; height: 100%; flex: none; }
        .brand .logo {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; color: var(--accent-text);
        }
        .brand .logo svg { width: 19px; height: 19px; display: block; }
        .brand-text {
            font-size: var(--text-xs); font-weight: var(--weight-bold);
            letter-spacing: 0.9px; color: var(--text-2); white-space: nowrap;
        }
        .brand-text b { color: var(--text); }

        .ws-name-wrap { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; min-width: 0; }

        select.ws-select {
            appearance: none;
            background: var(--field-bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%239598a1' stroke-width='1.5'/></svg>") no-repeat right 8px center;
            border: 1px solid var(--control-border); border-radius: var(--radius-sm);
            height: 28px; padding: 0 26px 0 9px;
            font-size: var(--text-sm); font-weight: var(--weight-medium);
            min-width: 138px; max-width: 200px;
            color: var(--text);
            outline: none; cursor: pointer;
            transition: border-color 140ms var(--ease), background 140ms var(--ease), box-shadow 140ms var(--ease);
        }
        select.ws-select:hover { border-color: var(--border-strong); background-color: var(--surface-3); }
        select.ws-select:focus-visible { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.16); }
        select.ws-select option { background: var(--surface-2); color: var(--text); }

        .ws-actions { display: flex; align-items: center; gap: 2px; }

        .icon-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: var(--hit-min); height: var(--hit-min); border-radius: var(--radius-sm);
            background: transparent; border: 1px solid transparent;
            color: var(--text-3); cursor: pointer; flex: none;
            transition: background 140ms var(--ease), color 140ms var(--ease), border-color 140ms var(--ease);
        }
        .icon-btn:hover { background: var(--surface-3); color: var(--text); }
        .icon-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .icon-btn svg { width: var(--icon-md); height: var(--icon-md); }
        /* Text-labelled toolbar buttons size to their label. */
        #btn-trade { width: auto; padding: 0 9px; font-size: var(--text-sm); font-weight: var(--weight-medium); }
        #btn-theme { color: var(--text-2); }
        .icon-btn[aria-pressed="true"] { color: var(--accent-text); background: var(--accent-soft); }

        .divider { width: 1px; height: 20px; background: var(--border); flex: none; }
        .ico { display: inline-flex; align-items: center; justify-content: center; }
        .ico svg { display: block; }
        .icon-btn > .ico svg { width: var(--icon-md); height: var(--icon-md); }

        .layout-switch {
            display: flex; align-items: center; gap: 1px; padding: 0;
            border: 0; border-radius: var(--radius-sm);
            background: transparent; flex: none;
        }
        .layout-btn {
            width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
            border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-3); cursor: pointer;
            transition: all 140ms var(--ease);
        }
        .layout-btn:hover { color: var(--text); background: var(--surface-3); }
        .layout-btn[aria-pressed="true"] {
            background: var(--accent-soft);
            color: var(--accent-text);
        }
        .layout-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .layout-btn svg { width: 17px; height: 17px; }

        .sync-bar { display: flex; align-items: center; gap: 2px; min-width: 0; flex: none; }
        .sync-label {
            display: none; font-family: var(--font-mono); font-size: var(--text-xs);
            letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase;
            margin-right: 2px;
        }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            height: 28px; padding: 0 8px;
            border: 1px solid transparent; border-radius: var(--radius-sm);
            background: transparent; color: var(--text-3);
            font-size: var(--text-sm); font-weight: var(--weight-medium); letter-spacing: 0.01em;
            cursor: pointer; white-space: nowrap; justify-content: center; min-width: 30px;
            transition: all 140ms var(--ease);
        }
        .chip .led { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.4; transition: all 140ms var(--ease); }
        .chip:hover { color: var(--text); background: var(--surface-3); }
        .chip[aria-pressed="true"] {
            color: var(--accent-text); background: var(--accent-soft);
        }
        .chip[aria-pressed="true"] .led { background: currentColor; opacity: 1; }
        .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

        .compact-field { display: flex; align-items: center; gap: 5px; flex: none; }
        .compact-field > span {
            font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.04em;
            color: var(--muted); text-transform: uppercase;
        }
        .compact-field select {
            height: 26px; padding: 0 22px 0 7px; font-size: var(--text-xs); max-width: 154px;
            border-radius: var(--radius-sm); border-color: var(--control-border); background-color: var(--field-bg);
        }
        .compact-field select:hover { border-color: var(--text-3); background-color: var(--surface-3); }

        .spacer { flex: 1; }

        .status-pill {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-3);
            padding: 4px 8px; border: 1px solid transparent; border-radius: var(--radius-sm);
            background: transparent; white-space: nowrap; max-width: 240px;
            overflow: hidden; text-overflow: ellipsis; flex: none;
        }
        .status-pill::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--success); box-shadow: 0 0 6px rgba(var(--success-rgb), 0.55);
        }
        .status-pill.saving { color: var(--accent-text); border-color: var(--accent-line); }
        .status-pill.saving::before { background: var(--accent-text); box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.7); }
        .status-pill.error { color: var(--danger); border-color: rgba(var(--danger-rgb), 0.5); }
        .status-pill.error::before { background: var(--danger); box-shadow: none; }

        /* ── Sub bar ───────────────────────────────────────────────────── */
        #ws-subbar {
            display: flex; align-items: center; gap: 8px;
            padding: 0 8px; background: var(--bg);
            border-bottom: 1px solid var(--border);
            min-width: 0;
        }
        .subbar-label {
            font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.04em;
            color: var(--muted); text-transform: uppercase; flex: none;
        }
        .group-chip {
            display: inline-flex; align-items: center; gap: 6px;
            height: 24px; padding: 0 8px 0 7px;
            border-radius: var(--radius-sm); border: 1px solid transparent;
            background: transparent; color: var(--text-3);
            font-size: var(--text-xs); cursor: pointer; white-space: nowrap;
            transition: all 140ms var(--ease);
        }
        .group-chip .swatch { width: 8px; height: 8px; border-radius: 2px; background: var(--g); box-shadow: 0 0 6px color-mix(in srgb, var(--g) 65%, transparent); }
        .group-chip .n { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-3); }
        .group-chip:hover { border-color: var(--border-strong); color: var(--text); }
        .group-chip[aria-pressed="true"] {
            border-color: color-mix(in srgb, var(--g) 55%, transparent);
            background: color-mix(in srgb, var(--g) 11%, transparent); color: var(--text);
        }
        .group-chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

        .btn-ghost {
            height: 24px; padding: 0 9px; border-radius: var(--radius-sm);
            border: 1px solid transparent; background: transparent; color: var(--text-3);
            font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; white-space: nowrap;
            transition: all 140ms var(--ease); flex: none;
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-3); }
        .btn-ghost:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .btn-ghost.primary {
            color: var(--accent-text);
            background: var(--accent-soft);
        }
        .btn-ghost.primary:hover { background: rgba(var(--accent-rgb), 0.26); }
        .btn-ghost.add-chart { color: var(--text-3); }
        .btn-ghost.add-chart:hover { color: var(--text); background: var(--surface-3); }

        .hover-hint { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); white-space: nowrap; }

        /* ── Grid ──────────────────────────────────────────────────────── */
        #ws-grid-wrap { position: relative; min-height: 0; overflow: hidden; }

        #ws-grid {
            display: grid;
            grid-template-columns: var(--ws-cols, 1fr 1fr);
            grid-template-rows: var(--ws-rows, 1fr 1fr);
            gap: var(--grid-gap);
            width: 100%; height: 100%;
            padding: 0;
            min-height: 0;
        }

        /* Hidden panels must leave grid flow: `visibility: hidden` still occupies
           cells, pushing them into implicit rows that the maximized panel
           (`grid-row: 1 / -1`, explicit tracks only) does not span — leaving a
           dead band at the bottom. */
        #ws-grid.maximized .panel:not(.is-maximized) { display: none; }
        #ws-grid.maximized .empty-cell { display: none; }
        #ws-grid.maximized .panel.is-maximized {
            grid-column: 1 / -1; grid-row: 1 / -1; z-index: 4;
            box-shadow: var(--shadow-pop);
        }

        .empty-cell {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            min-height: 0; border-radius: 0;
            border: 1px dashed var(--border-strong);
            background: var(--bg);
            color: var(--text-3); cursor: pointer;
            transition: all 160ms var(--ease);
        }
        .empty-cell .plus {
            width: 36px; height: 36px; border-radius: 50%;
            display: grid; place-items: center; font-size: var(--text-lg); font-weight: 300;
            border: 1px solid var(--border); color: var(--text-3);
            transition: all 160ms var(--ease);
        }
        .empty-cell .t { font-size: var(--text-base); font-weight: var(--weight-semibold); }
        .empty-cell .s { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
        .empty-cell:hover { border-color: var(--accent-line); background: rgba(var(--accent-rgb), 0.03); color: var(--text-2); }
        .empty-cell:hover .plus { color: var(--accent-text); border-color: var(--accent-line); background: var(--accent-soft); }
        .empty-cell:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

        /* ── Panel ─────────────────────────────────────────────────────── */
        .panel {
            --g: var(--border-strong);
            position: relative; display: flex; flex-direction: column;
            min-width: 0; min-height: 0;
            background: var(--chart-bg);
            border: 0;
            border-radius: 0;
            overflow: hidden; container-type: inline-size;
            box-shadow: none;
            animation: panel-in 160ms var(--ease-out);
            transition: box-shadow 160ms var(--ease);
        }
        @keyframes panel-in { from { opacity: 0; transform: translateY(4px); } }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--g), color-mix(in srgb, var(--g) 20%, transparent));
            opacity: 0.9; z-index: 3; pointer-events: none;
        }
        .panel.is-focused { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--g) 55%, transparent); }
        .panel.drag-over { box-shadow: inset 0 0 0 1px var(--accent); }

        .panel-head {
            height: var(--panel-head-h); flex: none;
            display: flex; align-items: center; gap: 5px;
            padding: 0 4px 0 6px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            user-select: none; min-width: 0;
        }

        .drag-grip {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 26px; flex: none;
            color: var(--muted); opacity: 0.45;
            cursor: grab; transition: opacity 140ms var(--ease), color 140ms var(--ease);
        }
        .drag-grip svg { width: 14px; height: 14px; }
        .panel:hover .drag-grip { opacity: 1; }
        .drag-grip:hover { color: var(--text); }
        .drag-grip:active { cursor: grabbing; }

        /* Group swatch inside a compact hit box (the button itself is invisible). */
        .group-dot {
            position: relative; width: 20px; height: 26px; flex: none;
            background: transparent; border: 0; padding: 0; cursor: pointer;
        }
        .group-dot::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 9px; height: 9px;
            border-radius: 2px; background: var(--g); transform: translate(-50%, -50%);
        }
        .group-dot.ungrouped::after {
            background: transparent; border: 1px dashed var(--muted); box-shadow: none;
        }
        .group-dot:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-radius: 6px; }

        .symbol-btn {
            display: inline-flex; align-items: baseline; gap: 6px;
            border: 0; background: transparent; cursor: pointer;
            padding: 3px 5px; border-radius: var(--radius-sm); min-width: 0; overflow: hidden;
            transition: background 140ms var(--ease);
        }
        .symbol-btn:hover { background: var(--hover-wash); }
        .symbol-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .symbol-btn .ex {
            font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.04em;
            color: var(--text-3); text-transform: uppercase;
        }
        .symbol-btn .sym {
            font-size: var(--text-base); font-weight: var(--weight-semibold);
            letter-spacing: -0.1px; white-space: nowrap; color: var(--text);
        }
        .symbol-btn .mkt {
            font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em;
            color: var(--text-3); border: 1px solid var(--border);
            border-radius: 2px; padding: 0 3px; background: transparent;
        }

        .head-btn {
            display: inline-flex; align-items: center; gap: 4px;
            height: 24px; padding: 0 6px; border: 1px solid transparent; border-radius: var(--radius-sm);
            background: transparent; color: var(--text-2); font-family: var(--font-mono);
            font-size: var(--text-xs); cursor: pointer; white-space: nowrap;
            transition: all 140ms var(--ease);
        }
        .head-btn:hover { background: var(--surface-3); color: var(--text); }
        .head-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .head-btn svg { width: 15px; height: 15px; flex: none; }
        .type-ico { display: inline-flex; align-items: center; }
        .head-btn .caret { width: 12px; height: 12px; color: var(--muted); margin-left: -1px; }

        .head-price {
            margin-left: auto; font-family: var(--font-mono); font-size: var(--text-sm);
            font-weight: var(--weight-medium); color: var(--text); white-space: nowrap;
        }
        .head-chg {
            font-family: var(--font-mono); font-size: var(--text-xs); white-space: nowrap;
            padding: 1px 5px; border-radius: 2px; background: transparent;
        }
        .up { color: var(--success); }
        .down { color: var(--danger); }
        .flat { color: var(--text-3); }
        .head-chg.up, .head-chg.down { background: transparent; }

        .panel-tools { display: inline-flex; align-items: center; gap: 0; flex: none; opacity: 0.9; transition: opacity 140ms var(--ease); }
        .panel:hover .panel-tools, .panel:focus-within .panel-tools { opacity: 1; }
        .panel-tools .icon-btn { width: 26px; height: 26px; border-radius: var(--radius-sm); }
        .panel-tools .icon-btn svg { width: 16px; height: 16px; }

        .panel-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

        .chart-host { flex: 1; min-height: 0; position: relative; }
        .chart-host > div { position: absolute; inset: 0; }

        /* Floating navigation pad (OpenTrader control bar): zoom, reset and
           jump-to-latest, revealed on pane hover so the plot stays clean. */
        .chart-controls {
            position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
            z-index: 6; display: flex; align-items: center; gap: 3px;
            opacity: 0; pointer-events: none;
            transition: opacity 160ms var(--ease);
        }
        .panel:hover .chart-controls, .panel:focus-within .chart-controls { opacity: 1; pointer-events: auto; }
        .cc-btn {
            width: 26px; height: 26px; padding: 0; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text-2); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            transition: background 140ms var(--ease), color 140ms var(--ease);
        }
        .cc-btn:hover { background: var(--surface-3); color: var(--text); }
        .cc-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .cc-btn svg { width: 16px; height: 16px; }
        .cc-btn[disabled] { opacity: 0.4; cursor: default; }
        .cc-btn[disabled]:hover { background: var(--surface); color: var(--text-2); }

        .osc-pane {
            position: relative; flex: none; height: 0; overflow: hidden;
            border-top: 1px solid var(--hairline); display: none;
            background: color-mix(in srgb, var(--chart-bg) 55%, transparent);
        }
        .osc-pane.show { display: block; }

        .draw-layer, .osc-layer {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 3;
        }
        .ind-layer {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
        }
        .draw-layer.active { pointer-events: auto; cursor: crosshair; }

        .draw-rail {
            position: absolute; left: 0; top: 0; bottom: 0; z-index: 6;
            display: none; flex-direction: column; align-items: stretch;
            width: 42px; padding: 4px 0;
            background: var(--surface); border-right: 1px solid var(--border);
            overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
        }
        .draw-rail::-webkit-scrollbar { display: none; }
        .draw-rail.open { display: flex; }
        .draw-rail button {
            flex: none; width: 42px; height: 32px; border-radius: 0; border: 0;
            background: transparent; color: var(--text-3); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: color 140ms var(--ease), background 140ms var(--ease);
        }
        .draw-rail button:hover { color: var(--text); background: var(--surface-3); }
        .draw-rail button[aria-pressed="true"] { color: var(--accent-text); background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
        .draw-rail button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
        .draw-rail svg { width: 22px; height: 22px; }
        .draw-rail .sep { flex: none; height: 1px; background: var(--border); margin: 3px 8px; }

        /* Full tool palette (lightweight-charts-drawing catalog). */
        .draw-palette {
            position: absolute; left: 42px; top: 0; bottom: 0; z-index: 7;
            display: flex; flex-direction: column;
            width: min(304px, calc(100% - 42px));
            border-radius: 0; background: var(--surface);
            border: 0; border-right: 1px solid var(--border);
            box-shadow: 12px 0 28px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            animation: dp-in 140ms var(--ease-out);
        }
        @keyframes dp-in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
        .dp-head { display: flex; gap: 4px; align-items: center; padding: 6px; border-bottom: 1px solid var(--border); }
        .dp-search {
            flex: 1; min-width: 0; height: 26px; padding: 0 8px;
            border-radius: var(--radius-sm); border: 1px solid transparent;
            background: var(--field-bg); color: var(--text); font: inherit; font-size: var(--text-xs);
        }
        .dp-search:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .dp-search-ico { flex: none; display: inline-flex; align-items: center; color: var(--muted); padding: 0 1px 0 4px; }
        .dp-search-ico svg { width: 15px; height: 15px; }
        .dp-close {
            width: 26px; height: 26px; flex: none;
            border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent;
            color: var(--text-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
        }
        .dp-close:hover { color: var(--text); background: var(--surface-3); }
        .dp-close:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .dp-close svg { width: var(--icon-sm); height: var(--icon-sm); }
        .dp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px; scrollbar-width: thin; }
        .dp-group { margin-bottom: 4px; }
        .dp-group-title {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 6px 4px; color: var(--muted);
            font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: 0.04em; text-transform: uppercase;
        }
        .dp-count { color: var(--muted); font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0; }
        .dp-group-name { display: inline-flex; align-items: center; gap: 6px; }
        .dp-group-name svg { width: 15px; height: 15px; color: var(--muted); }
        .dp-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
        .dp-item { display: flex; align-items: center; min-width: 0; border-radius: var(--radius-sm); }
        .dp-item:hover { background: var(--surface-3); }
        .dp-tool {
            display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; min-height: 28px; padding: 0 6px;
            border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent;
            color: var(--text-2); font: inherit; font-size: var(--text-xs); text-align: left; cursor: pointer;
            transition: color 140ms var(--ease), background 140ms var(--ease), border-color 140ms var(--ease);
        }
        .dp-tool > svg { width: 18px; height: 18px; flex: none; color: var(--text-3); }
        .dp-tool:hover > svg { color: var(--text-2); }
        .dp-tool[aria-pressed="true"] > svg { color: var(--accent-text); }
        .dp-toggle { display: inline-flex; align-items: center; gap: 5px; }
        .dp-toggle svg { width: 15px; height: 15px; }
        .dp-toggle[aria-pressed="true"] svg { color: var(--accent-text); }
        .dp-fav {
            flex: none; width: 24px; height: 24px; margin-right: 2px; padding: 0;
            border-radius: 5px; border: 1px solid transparent; background: transparent;
            color: var(--muted); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            opacity: 0.75; transition: color 140ms var(--ease), opacity 140ms var(--ease), background 140ms var(--ease);
        }
        .dp-fav svg { width: 14px; height: 14px; }
        .dp-item:hover .dp-fav { opacity: 1; }
        .dp-fav:hover { color: var(--text); background: var(--hover-wash); opacity: 1; }
        .dp-fav[aria-pressed="true"] { color: var(--accent-text); opacity: 1; }
        .dp-fav[aria-pressed="true"] svg { fill: currentColor; }
        .dp-fav:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; opacity: 1; }
        .dp-tool-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dp-tool:hover { color: var(--text); background: var(--surface-3); }
        .dp-tool[aria-pressed="true"] { color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent-line); }
        .dp-tool:focus-visible { outline: 2px solid var(--focus); outline-offset: -1px; }
        .dp-empty { margin: 12px 6px; color: var(--text-3); font-size: var(--text-sm); }
        .dp-foot {
            display: flex; align-items: center; gap: 4px; padding: 5px 6px;
            border-top: 1px solid var(--border); background: var(--surface);
        }
        .dp-toggle {
            height: 24px; padding: 0 8px; border-radius: var(--radius-sm);
            border: 1px solid transparent; background: transparent;
            color: var(--text-3); font: inherit; font-size: var(--text-xs); cursor: pointer;
        }
        .dp-toggle:hover { color: var(--text); border-color: var(--control-border); }
        .dp-toggle[aria-pressed="true"] { color: var(--accent-text); border-color: var(--accent-line); background: var(--accent-soft); }
        .dp-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .dp-hint { margin-left: auto; color: var(--muted); font-size: var(--text-xs); font-family: var(--font-mono); }

        /* Contextual style bar for the selected drawing(s). */
        .draw-stylebar {
            position: absolute; left: 48px; bottom: 6px; z-index: 7;
            display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
            max-width: calc(100% - 56px); padding: 3px 5px;
            border-radius: var(--radius-sm);
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-pop);
        }
        .draw-stylebar[hidden] { display: none; }
        .dsb-icon { display: inline-flex; align-items: center; }
        .dsb-kind {
            max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--text); font-size: var(--text-xs); font-weight: var(--weight-medium);
        }
        .dsb-colors { display: inline-flex; gap: 3px; }
        .dsb-swatch {
            width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.35); padding: 0;
            transition: transform 120ms var(--ease), box-shadow 120ms var(--ease);
        }
        .dsb-swatch:hover { transform: scale(1.14); }
        .dsb-swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--text); }
        .dsb-swatch:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        .dsb-sep { width: 1px; height: 18px; background: var(--border); }
        .dsb-group { display: inline-flex; gap: 2px; }
        .dsb-btn {
            min-width: 24px; height: 24px; padding: 0 5px; border-radius: 5px;
            border: 1px solid transparent; background: transparent; color: var(--text-2);
            font: inherit; font-size: var(--text-xs); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .dsb-btn:hover { color: var(--text); background: var(--surface-3); }
        .dsb-btn[aria-pressed="true"] { color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent-line); }
        .dsb-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .dsb-icon svg { width: var(--icon-sm); height: var(--icon-sm); }
        .dsb-danger:hover { color: var(--danger); background: var(--danger-soft); }
        .dsb-dash { position: relative; min-width: 26px; }
        .dsb-dash::after {
            content: ''; position: absolute; left: 5px; right: 5px; top: 50%; height: 0;
            border-top: 1.5px solid currentColor;
        }
        .dsb-dash-dashed::after { border-top-style: dashed; }
        .dsb-dash-dotted::after { border-top-style: dotted; }

        @media (max-width: 720px) {
            .draw-palette { width: calc(100% - 42px); }
            .draw-stylebar { left: 6px; max-width: calc(100% - 12px); }
        }

        .panel-overlay {
            position: absolute; inset: 0; z-index: 8;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; gap: 12px;
            background: color-mix(in srgb, var(--chart-bg) 92%, transparent);
            font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-2);
            text-align: center; padding: 22px;
        }
        .panel-overlay.show { display: flex; }
        .panel-overlay.error { color: var(--danger); }
        .panel-overlay .ov-title { color: var(--text); font-family: var(--font-body); font-size: var(--text-md); font-weight: var(--weight-semibold); letter-spacing: -0.1px; line-height: var(--leading-heading); }
        .panel-overlay button { margin-top: 2px; }
        .spinner {
            width: 24px; height: 24px; border-radius: 50%;
            border: 2px solid rgba(var(--accent-rgb), 0.14);
            border-top-color: var(--accent-text);
            animation: spin 700ms linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Always-on legend at the top-left of the plot (TradingView pattern):
           OHLC values track the crosshair, studies stack underneath. */
        .ohlc-strip {
            position: absolute; left: 8px; top: 6px; z-index: 5;
            display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
            font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-2);
            background: transparent; border: 0; border-radius: 0;
            padding: 0; pointer-events: none;
            opacity: 0; transform: translateY(-2px);
            transition: opacity 150ms var(--ease), transform 150ms var(--ease);
            max-width: calc(100% - 70px); overflow: hidden; white-space: nowrap;
        }
        .ohlc-strip.show { opacity: 1; transform: none; }
        .ohlc-strip .lv-values { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
        .ohlc-strip .lv-values span { display: inline-flex; gap: 3px; }
        .ohlc-strip b { color: var(--text); font-weight: var(--weight-medium); }
        .ohlc-strip .lv-change { font-weight: var(--weight-medium); }
        .ohlc-strip .lv-change.up { color: var(--success); }
        .ohlc-strip .lv-change.down { color: var(--danger); }
        .ohlc-strip .ind-legend { flex-direction: column; align-items: flex-start; gap: 1px; }
        .ohlc-strip .ind-legend span { padding: 0 2px; background: transparent; }

        .agg-note {
            position: absolute; right: 84px; top: 9px; z-index: 5;
            font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.02em;
            color: var(--text-3); background: color-mix(in srgb, var(--chart-bg) 88%, transparent);
            border: 1px solid var(--border); border-radius: 4px;
            padding: 3px 6px; pointer-events: none; display: none;
        }
        .agg-note.show { display: block; }

        .text-editor {
            position: absolute; z-index: 12; min-width: 140px;
            background: var(--surface-2); border: 1px solid var(--accent);
            border-radius: 6px; padding: 5px 7px; display: none;
            box-shadow: var(--shadow-pop);
        }
        .text-editor.show { display: block; }
        .text-editor input {
            width: 100%; border: 0; outline: none; background: transparent;
            color: var(--text); font-family: var(--font-mono); font-size: var(--text-base);
        }

        .ind-legend {
            display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none;
        }
        .ind-legend span {
            font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.01em;
            color: var(--text-3); background: transparent; border: 0; padding: 0;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .ind-legend span::before {
            content: ''; width: 4px; height: 4px; border-radius: 50%;
            background: var(--lite, var(--text-3));
        }
        .ind-legend span b { color: var(--lite); font-weight: 500; }
        .ind-legend.in-foot { position: static; max-width: none; overflow: hidden; flex-wrap: nowrap; }

        .panel-foot {
            height: var(--panel-foot-h); flex: none;
            display: flex; align-items: center; gap: 8px;
            padding: 0 8px; border-top: 1px solid var(--border);
            font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted);
            background: var(--surface); white-space: nowrap; overflow: hidden;
        }
        .panel-foot .live { display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); }
        .panel-foot .live::before {
            content: ''; width: 5px; height: 5px; border-radius: 50%;
            background: var(--success); box-shadow: 0 0 6px rgba(var(--success-rgb), 0.8);
        }
        .panel-foot .live.stale::before { background: var(--accent); box-shadow: none; }
        .panel-foot .live.offline::before { background: var(--danger); box-shadow: none; }
        .panel-foot .ms { margin-left: auto; }

        @keyframes flash-up { 0% { color: var(--success); } 100% { color: var(--text); } }
        @keyframes flash-down { 0% { color: var(--danger); } 100% { color: var(--text); } }
        .flash-up { animation: flash-up 420ms var(--ease); }
        .flash-down { animation: flash-down 420ms var(--ease); }

        /* ── Popovers ──────────────────────────────────────────────────── */
        .pop-menu {
            position: fixed; z-index: 60; min-width: 160px; max-height: 330px; overflow: auto;
            background: var(--surface); border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-pop); padding: 4px; display: none;
        }
        .pop-menu.open { display: block; animation: pop-in 130ms var(--ease-out); }
        @keyframes pop-in { from { opacity: 0; transform: translateY(-5px) scale(0.995); } }
        .pop-title {
            padding: 7px 10px 6px; font-family: var(--font-mono);
            font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
        }
        .pop-item {
            display: flex; align-items: center; gap: 9px;
            width: 100%; min-height: var(--control-h-sm); padding: 6px 10px;
            border: 0; border-radius: 6px; background: transparent;
            color: var(--text-2); font-size: var(--text-base); text-align: left; cursor: pointer;
        }
        .pop-item:hover { background: var(--surface-3); color: var(--text); }
        .pop-item[aria-checked="true"] { color: var(--accent-text); background: rgba(var(--accent-rgb), 0.06); }
        .pop-item .key { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); }
        .pop-item > svg { width: 16px; height: 16px; flex: none; color: var(--text-3); }
        .pop-item[aria-checked="true"] > svg { color: var(--accent-text); }
        .pop-item:disabled { opacity: 0.5; cursor: not-allowed; }
        .pop-item .tag {
            margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs);
            border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; color: var(--muted);
        }
        .pop-sep { height: 1px; background: var(--border); margin: 4px 6px; }

        /* ── Modal ─────────────────────────────────────────────────────── */
        #ws-modal-backdrop {
            position: fixed; inset: 0; z-index: 70; display: none;
            background: rgba(2, 3, 5, 0.7); backdrop-filter: blur(6px);
            align-items: center; justify-content: center; padding: 24px;
        }
        #ws-modal-backdrop.open { display: flex; }
        .modal {
            width: min(640px, 100%); max-height: min(82vh, 780px);
            display: flex; flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border-strong); border-radius: var(--radius-md);
            box-shadow: var(--shadow-pop);
            animation: modal-in 160ms var(--ease-out); overflow: hidden;
        }
        @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(0.99); } }
        .modal-head {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px; border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .modal-title { font-size: var(--text-md); font-weight: var(--weight-semibold); letter-spacing: -0.1px; line-height: var(--leading-heading); }
        .modal-sub { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-3); margin-top: 2px; }
        .modal-head .icon-btn { margin-left: auto; }
        #drawer-keys svg { width: 20px; height: 20px; }
        .modal-body { padding: 14px; overflow: auto; min-height: 0; }
        .modal-foot {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 14px; border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
        .input {
            height: var(--input-h); padding: 0 12px; background: var(--field-bg);
            border: 1px solid var(--control-border); border-radius: var(--radius-sm);
            color: var(--text); font-size: var(--text-base); outline: none;
            transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease);
        }
        .input::placeholder { color: var(--muted); }
        .input:focus { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.14); }
        .input.mono { font-family: var(--font-mono); font-size: var(--text-base); }

        /* ── Position tool settings ─────────────────────────────────────── */
        .pos-form { display: grid; gap: 18px; }
        .pos-section { display: grid; gap: 10px; }
        .pos-section + .pos-section { padding-top: 15px; border-top: 1px solid var(--border); }
        .pos-section-title {
            display: flex; align-items: baseline; gap: 8px;
            font-size: var(--text-xs); font-weight: var(--weight-semibold);
            letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
        }
        .pos-section-title .sub { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); letter-spacing: 0; text-transform: none; }
        .pos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .pos-grid.three { grid-template-columns: repeat(3, 1fr); }
        .pos-risk { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: end; }
        .pos-switches { display: grid; gap: 8px; }
        .pos-switch {
            display: flex; align-items: center; gap: 12px;
            padding: 9px 11px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); background: var(--field-bg);
        }
        .pos-switch .lbl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .pos-switch .lbl b { font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text); }
        .pos-switch .lbl span { font-size: var(--text-xs); color: var(--text-3); line-height: 1.35; }
        .pos-switch .switch { margin-left: auto; }
        .pos-preview {
            display: grid; gap: 8px; padding: 11px 13px;
            border: 1px solid var(--border); border-radius: var(--radius-md);
            background-color: var(--field-bg);
            background-image: linear-gradient(180deg, var(--surface-3), transparent);
        }
        .pos-preview-head { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-3); }
        .pos-preview-head b { color: var(--text); font-weight: var(--weight-semibold); letter-spacing: 0.04em; }
        .pos-preview-head .dir { font-weight: var(--weight-semibold); letter-spacing: 0.06em; }
        .pos-preview-head .dir.long { color: var(--chart-up); }
        .pos-preview-head .dir.short { color: var(--chart-down); }
        .pos-preview-head .spacer { margin-left: auto; }
        .pos-preview-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 16px; }
        .pos-preview-row { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-mono); font-size: var(--text-xs); }
        .pos-preview-row span { color: var(--text-3); }
        .pos-preview-row b { margin-left: auto; color: var(--text); font-weight: var(--weight-medium); text-align: right; }
        .pos-preview-row b.up { color: var(--chart-up); }
        .pos-preview-row b.down { color: var(--chart-down); }
        .pos-preview-row b.dir.long { color: var(--chart-up); }
        .pos-preview-row b.dir.short { color: var(--chart-down); }
        .pos-empty {
            padding: 12px 13px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
            font-size: var(--text-sm); color: var(--text-3); line-height: 1.45;
        }
        .pos-error { min-height: 0; margin: 0; font-size: var(--text-sm); color: var(--danger); }
        .pos-error:empty { display: none; }
        .pos-hint { font-size: var(--text-xs); color: var(--muted); line-height: 1.4; }

        .seg { display: inline-flex; padding: 2px; gap: 1px; background: var(--field-bg); border: 1px solid var(--control-border); border-radius: var(--radius-sm); }
        .seg button {
            height: var(--control-h-sm); padding: 0 10px; border: 0; border-radius: 3px;
            background: transparent; color: var(--text-3); font-size: var(--text-base); font-weight: var(--weight-medium); cursor: pointer;
        }
        .seg button:hover { color: var(--text-2); }
        .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }

        .sym-grid { display: grid; grid-template-columns: 200px 1fr; gap: 14px; min-height: 310px; }
        .sym-list { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: auto; background: var(--field-bg); }
        .ex-item {
            display: flex; align-items: center; gap: 9px; width: 100%;
            padding: 10px 12px; border: 0; background: transparent; color: var(--text-2);
            font-size: var(--text-base); text-align: left; cursor: pointer; border-bottom: 1px solid var(--hairline);
        }
        .ex-item:last-child { border-bottom: 0; }
        .ex-item:hover { background: var(--surface-3); color: var(--text); }
        .ex-item[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
        .ex-item .mk { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.04em; }
        .ex-item[aria-pressed="true"] .mk { color: var(--text-3); }
        .ex-item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .sym-main { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
        .sym-tools { display: flex; gap: 7px; }
        .sym-tools .input { flex: 1; }
        .sym-results { flex: 1; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--field-bg); min-height: 190px; }
        .sym-row {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 9px 12px; border: 0; border-bottom: 1px solid var(--hairline);
            background: transparent; color: var(--text-2); font-size: var(--text-base);
            cursor: pointer; text-align: left; font-family: var(--font-mono);
        }
        .sym-row > span:last-child { margin-left: auto; color: var(--muted); font-size: var(--text-xs); }
        .sym-row:hover { background: var(--surface-3); color: var(--text); }
        .sym-row:hover > span:last-child { color: var(--text-3); }
        .sym-row[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-ink); }
        .sym-empty { padding: 28px 16px; text-align: center; font-family: var(--font-mono); font-size: var(--text-sm); color: var(--muted); }
        .chips-row { display: flex; flex-wrap: wrap; gap: 5px; }
        .mini-chip {
            border: 1px solid var(--border); border-radius: 999px; background: var(--field-bg);
            color: var(--text-3); font-family: var(--font-mono); font-size: var(--text-xs);
            padding: 5px 9px; cursor: pointer; transition: all 140ms var(--ease);
        }
        .mini-chip:hover { color: var(--text); border-color: var(--border-strong); }

        .ind-row {
            display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 14px;
            padding: 12px 8px; border-bottom: 1px solid var(--hairline);
        }
        .ind-row:last-child { border-bottom: 0; }
        .ind-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); justify-self: center; box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); }
        .ind-name { font-size: var(--text-base); color: var(--text); }
        .ind-desc { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); margin-top: 3px; }
        .ind-params { display: flex; gap: 6px; align-items: center; }
        .ind-params input {
            width: 62px; height: var(--control-h-sm); background: var(--surface-2);
            border: 1px solid var(--control-border);
            border-radius: 6px; padding: 0 8px; font-family: var(--font-mono); font-size: var(--text-base);
            color: var(--text-2); outline: none; text-align: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
            transition: border-color 140ms var(--ease), opacity 140ms var(--ease);
        }
        .ind-params input:hover:not(:disabled) { border-color: var(--text-3); }
        .ind-params input:focus { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.12); }
        .ind-params input:disabled { opacity: 0.5; }

        .switch {
            position: relative; width: 40px; height: 24px; flex: none;
            border-radius: 999px; border: 1px solid var(--control-border); background: var(--field-bg);
            cursor: pointer; transition: all 150ms var(--ease);
        }
        .switch::after {
            content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
            border-radius: 50%; background: var(--text-3); transition: all 150ms var(--ease);
        }
        .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
        .switch[aria-checked="true"]::after { left: 19px; background: #fff; }
        .switch:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

        /* ── Drawer ────────────────────────────────────────────────────── */
        #ws-drawer-backdrop {
            position: fixed; inset: 0; z-index: 64; display: none;
            background: rgba(2, 3, 5, 0.55); backdrop-filter: blur(2px);
        }
        #ws-drawer-backdrop.open { display: block; animation: fade-in 180ms var(--ease); }
        @keyframes fade-in { from { opacity: 0; } }
        #ws-drawer {
            position: fixed; top: 0; right: 0; bottom: 0; width: 400px; z-index: 65;
            background: var(--surface);
            border-left: 1px solid var(--border-strong);
            box-shadow: -24px 0 64px rgba(0, 0, 0, 0.55);
            transform: translateX(102%); transition: transform 240ms var(--ease-out);
            display: flex; flex-direction: column;
        }
        #ws-drawer.open { transform: none; }
        .drawer-head { display: flex; align-items: center; gap: 8px; padding: 15px 17px; border-bottom: 1px solid var(--border); }
        .drawer-body { padding: 15px 17px; overflow: auto; display: flex; flex-direction: column; gap: 11px; }
        .group-card {
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--field-bg); padding: 11px;
            display: flex; flex-direction: column; gap: 9px;
        }
        .group-card-head { display: flex; align-items: center; gap: 8px; }
        .group-card-head input[type="color"] {
            width: 24px; height: 24px; border: 1px solid var(--control-border); background: none;
            padding: 2px; cursor: pointer; border-radius: 6px; overflow: hidden;
        }
        .group-card-head input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .group-card-head input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 3px; }
        .group-card-head .gname {
            flex: 1; height: var(--control-h); background: var(--field-bg); border: 1px solid var(--control-border);
            border-radius: 6px; padding: 0 10px; font-size: var(--text-base); outline: none;
        }
        .group-card-head .gname:focus { border-color: var(--focus); }
        .group-card .sync-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .group-card .sync-toggle {
            display: flex; align-items: center; justify-content: center; gap: 5px;
            height: var(--control-h-sm); border: 1px solid var(--control-border); border-radius: 6px;
            background: var(--field-bg); color: var(--text-3); font-size: var(--text-sm); cursor: pointer;
            transition: all 140ms var(--ease);
        }
        .group-card .sync-toggle[aria-pressed="true"] { color: var(--accent-text); border-color: var(--accent-line); background: var(--accent-soft); }
        .group-members { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--muted); line-height: var(--leading-body); }
        .group-card .row { display: flex; gap: 8px; align-items: center; }
        .group-card .row .input { flex: 1; height: var(--control-h); }

        /* ── Credentials modal ─────────────────────────────────────────── */
        .cred-body { display: flex; flex-direction: column; gap: 15px; }
        .cred-note {
            font-family: var(--font-mono); font-size: var(--text-sm); line-height: var(--leading-body);
            color: var(--text-2); padding: 10px 12px; border-radius: 7px;
            border: 1px solid var(--border); border-left: 2px solid var(--accent-line);
            background: rgba(var(--accent-rgb), 0.035);
        }
        .cred-group { display: flex; flex-direction: column; gap: 10px; }
        .cred-group-head {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--text-2);
        }
        .cred-group-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .cred-count { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.02em; }
        .cred-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; }
        .cred-row > label {
            font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.04em;
            text-transform: uppercase; color: var(--text-3);
        }
        .cred-row .input { grid-column: 1 / -1; font-family: var(--font-mono); font-size: var(--text-base); }
        .cred-meta { display: flex; align-items: center; gap: 8px; justify-self: end; }
        .cred-state {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.04em;
            color: var(--muted); text-transform: uppercase;
        }
        .cred-state::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong);
        }
        .cred-state.set { color: var(--success); }
        .cred-state.set::before { background: var(--success); box-shadow: 0 0 6px rgba(var(--success-rgb), 0.65); }
        .cred-state.pending { color: var(--accent-text); }
        .cred-state.pending::before { background: var(--accent); box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.6); }
        .cred-clear {
            width: 26px; height: 26px; border-radius: 4px; border: 1px solid transparent;
            background: transparent; color: var(--muted); font-size: var(--text-base); line-height: 1;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
        }
        .cred-clear:hover { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
        .cred-clear:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
        .cred-clear.hidden { visibility: hidden; }
        .cred-error {
            font-family: var(--font-mono); font-size: var(--text-sm); line-height: var(--leading-body);
            color: var(--danger); border: 1px solid rgba(var(--danger-rgb), 0.35);
            background: rgba(var(--danger-rgb), 0.08); border-radius: 7px; padding: 8px 10px;
        }
        .cred-error:empty { display: none; }
        .cred-foot-note {
            margin-right: auto; font-family: var(--font-mono); font-size: var(--text-xs);
            color: var(--muted); letter-spacing: 0.01em;
        }

        #ws-toast {
            position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 12px);
            z-index: 90; padding: 7px 12px; border-radius: var(--radius-sm);
            background: var(--surface-3); border: 1px solid var(--border-strong);
            border-left: 2px solid var(--accent);
            font-family: var(--font-mono); font-size: var(--text-base); color: var(--text-2);
            box-shadow: var(--shadow-pop);
            opacity: 0; pointer-events: none; transition: all 220ms var(--ease-out);
            max-width: min(580px, calc(100% - 32px)); text-align: center;
        }
        #ws-toast.show { opacity: 1; transform: translate(-50%, 0); }
        #ws-toast.error { border-left-color: var(--danger); color: var(--danger); }

        .ws-gutter { position: absolute; z-index: 9; background: transparent; }
        .ws-gutter.v { top: 0; bottom: 0; width: 10px; cursor: col-resize; transform: translateX(-50%); }
        .ws-gutter.h { left: 0; right: 0; height: 10px; cursor: row-resize; transform: translateY(-50%); }
        .ws-gutter::after { content: ''; position: absolute; background: transparent; transition: background 130ms var(--ease); }
        .ws-gutter.v::after { top: 50%; left: 50%; width: 2px; height: 26px; transform: translate(-50%, -50%); border-radius: 2px; }
        .ws-gutter.h::after { top: 50%; left: 50%; height: 2px; width: 26px; transform: translate(-50%, -50%); border-radius: 2px; }
        .ws-gutter:hover::after { background: var(--accent); }

        /* ── Responsive ────────────────────────────────────────────────── */
        @media (max-width: 1599px) {
            #ws-topbar { gap: 8px; }
        }
        @media (max-width: 1439px) {
            /* Keep the 13px label text; drop the words, keep LED + tooltip. */
            .sync-bar .chip .lbl { display: none; }
            .sync-label { display: inline; }
            .chip { padding: 0 9px; }
        }
        @media (max-width: 1280px) {
            .brand-text { display: none; }
            .hover-hint { display: none; }
            .status-pill { max-width: 150px; }
        }
        @media (max-width: 1100px) {
            .compact-field > span { display: none; }
            .compact-field select { height: var(--control-h-sm); }
            #ws-subbar .divider { display: none; }
            .sync-label { display: none; }
        }
        @media (max-width: 900px) {
            .layout-switch, .layout-switch + .divider { display: none; }
        }
        @media (max-width: 860px) {
            :root { --topbar-h: 42px; --subbar-h: 32px; }
            .sync-bar { display: none; }
            #ws-topbar { overflow-x: auto; }
            .subbar-label { display: none; }
        }
        @container (max-width: 700px) {
            /* Below ~700px the chart-type button is the first thing to go; the
               symbol, timeframe, price and change stay at full size. */
            .head-btn.type-btn { display: none; }
        }
        @container (max-width: 560px) {
            .panel-head { gap: 4px; }
            .ohlc-strip .lv-change { display: none; }
        }
        @container (max-width: 480px) {
            .ohlc-strip .lv-values span:nth-child(5) { display: none; }
        }
        @container (max-width: 470px) {
            .head-chg { display: none; }
            .panel-tools { opacity: 0.75; }
        }
        @container (max-width: 430px) {
            .symbol-btn .mkt { display: none; }
            .head-btn.type-btn { display: none; }
        }
        @container (max-width: 360px) {
            .symbol-btn .ex { display: none; }
            .head-btn { padding: 0 6px; }
        }
</style>
</head>

<body>
    <div id="ws-root">
        <header id="ws-topbar">
            <div class="brand">
                <span class="logo" data-icon="tp-logo" data-icon-size="19" aria-hidden="true"></span>
                <span class="brand-text"><b>MULTI</b>CHART</span>
            </div>

            <div class="ws-name-wrap">
                <select id="ws-select" class="ws-select" aria-label="Workspace"></select>
                <div class="ws-actions">
                    <button id="ws-new" class="icon-btn" title="New workspace" aria-label="New workspace"><span class="ico" data-icon="scr-add" data-icon-size="18"></span></button>
                    <button id="ws-rename" class="icon-btn" title="Rename workspace" aria-label="Rename workspace"><span class="ico" data-icon="menu-manage-layouts-rename" data-icon-size="18"></span></button>
                    <button id="ws-delete" class="icon-btn" title="Delete workspace" aria-label="Delete workspace"><span class="ico" data-icon="scr-trash" data-icon-size="18"></span></button>
                </div>
            </div>

            <div class="divider"></div>

            <div class="layout-switch" id="layout-switch" role="group" aria-label="Chart layout"></div>

            <div class="divider"></div>

            <div class="sync-bar" id="sync-bar" role="group" aria-label="Synchronization">
                <span class="sync-label">Sync</span>
                <button class="chip" data-sync="crosshair" aria-pressed="true" title="Synchronize crosshair">
                    <span class="led"></span><span class="lbl">Crosshair</span>
                </button>
                <button class="chip" data-sync="timeRange" aria-pressed="true" title="Synchronize visible time range">
                    <span class="led"></span><span class="lbl">Time</span>
                </button>
                <button class="chip" data-sync="horizontalScroll" aria-pressed="true" title="Synchronize horizontal scroll">
                    <span class="led"></span><span class="lbl">Scroll</span>
                </button>
                <button class="chip" data-sync="zoom" aria-pressed="true" title="Synchronize zoom">
                    <span class="led"></span><span class="lbl">Zoom</span>
                </button>
                <button class="chip" data-sync="timeframe" aria-pressed="false" title="Synchronize timeframe changes">
                    <span class="led"></span><span class="lbl">TF</span>
                </button>
            </div>

            <div class="spacer"></div>

            <span id="ws-status" class="status-pill" role="status">Ready</span>
            <button id="btn-groups" class="icon-btn" title="Synchronization groups" aria-label="Synchronization groups"><span class="ico" data-icon="ot-header-group" data-icon-size="18"></span></button>
            <button id="btn-fullscreen" class="icon-btn" title="Fullscreen (F11)" aria-label="Fullscreen"><span class="ico" data-icon="header-fullscreen-mode" data-icon-size="18"></span></button>
            <button id="btn-trade" class="icon-btn" title="Show/hide trade panel" aria-label="Toggle trade panel">Trade</button>
            <button id="btn-settings" class="icon-btn" title="Settings (Ctrl+,)" aria-label="Open settings"><span class="ico" data-icon="header-settings" data-icon-size="18"></span></button>
            <button id="btn-theme" class="icon-btn" title="Toggle light/dark theme" aria-label="Toggle theme"><span class="ico" data-icon="tp-moon" data-icon-size="18"></span></button>
        </header>

        <div id="ws-subbar">
            <span class="subbar-label">Groups</span>
            <div id="group-chips" style="display:flex;gap:5px;align-items:center;min-width:0;overflow:hidden;"></div>
            <button id="btn-add-chart" class="btn-ghost add-chart" title="Add a chart panel">+ Chart</button>
            <div class="divider"></div>
            <div class="compact-field">
                <span>Scale</span>
                <select id="price-mode" class="ws-select" title="Price scale mode" aria-label="Price scale mode">
                    <option value="independent">Independent</option>
                    <option value="absolute">Absolute</option>
                    <option value="percentage">Percentage</option>
                    <option value="indexed">Indexed 100</option>
                </select>
            </div>

            <div class="compact-field">
                <span>Snap</span>
                <select id="nearest-policy" class="ws-select" title="Nearest candle policy for crosshair sync" aria-label="Nearest candle policy">
                    <option value="previous">Previous</option>
                    <option value="closest">Closest</option>
                    <option value="next">Next</option>
                    <option value="none">Exact</option>
                </select>
            </div>

            <div class="spacer"></div>
            <span class="hover-hint" id="ws-hint">Drag headers to rearrange · double-click header to maximize</span>
            <button id="btn-save" class="btn-ghost primary" title="Save workspace now">Save</button>
        </div>

        <div id="ws-grid-wrap">
            <main id="ws-grid" aria-label="Chart grid"></main>
            <div id="ws-gutters"></div>
        </div>
