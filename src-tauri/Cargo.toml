[package]
name = "tradepanel"
version = "0.1.0"
description = "TradePanel desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tradepanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enabled for release builds only: embeds frontend/dist instead of loading
# `build.devUrl`. Without this split `tauri dev` ignores the Vite server and
# always serves whatever was compiled into the binary.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "process", "io-util"] }
log = "0.4"
open = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
incremental = true
